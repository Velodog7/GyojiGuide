<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rikishi · Sumo Slapdown</title>
<meta name="description" content="Every sekitori on the current banzuke — rank, record, form, injuries, career figures and head-to-head.">
<link rel="preload" as="script" href="gg-nav.js">
<link rel="preload" as="script" href="gg-auth.js">
<link rel="preload" as="image" href="SumoSlapdown-logowide.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#000; --ink:#f1f2f6; --muted:#878da0; --gold:#d8b25a;
         --sun:#d8b25a; --red:#e23b2e; --line:#2a2e3a; --dim:#a7adbe; --faint:#6b7180;
         --surface:#181a22; --surface2:#20232d; --win:#5bbf7a; --loss:#e2574c; }
  *{ box-sizing:border-box }
  html,body{ margin:0 }
  body{ background:var(--bg); color:var(--ink); font-family:"Space Grotesk",system-ui,sans-serif;
        -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; flex-direction:column }
  a{ color:inherit }
  .wrap{ max-width:1180px; margin:0 auto; padding:18px 16px 60px; width:100% }

  /* ── the analysis subnav, so a profile still reads as part of that page ──
     A rikishi profile IS the Rikishi tab's content; without the bar it looks
     like a page that fell out of the site. The current tab is a <span>, not a
     link — a link to where you already are is a dead end. */
  nav.tabs{ position:sticky; top:0; z-index:30; background:rgba(14,15,20,.92);
            -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
            border-bottom:1px solid var(--line) }
  .tabs-inner{ max-width:1180px; margin:0 auto; padding:0 6px; display:flex }
  .tab{ flex:1 1 0; position:relative; display:flex; flex-direction:column; align-items:center;
        justify-content:center; gap:4px; background:none; border:0; border-bottom:2px solid transparent;
        color:var(--muted); padding:9px 0; cursor:pointer; transition:color .12s;
        text-decoration:none; font-family:inherit }
  .tab svg{ width:20px; height:20px; display:block }
  .tab-lab{ font-size:.85rem; font-weight:600; letter-spacing:.01em; line-height:1.15; text-align:center }
  .tab:hover{ color:var(--dim) }
  .tab[aria-selected="true"]{ color:var(--sun); border-bottom-color:var(--red); cursor:default }
  @media (max-width:640px){ .tab svg{ width:17px; height:17px }
    .tab-lab{ font-size:.62rem; font-weight:500; line-height:1.1 } }

  /* ── profile ───────────────────────────────────────────── */
  .back{ display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none;
         font-size:.85rem; margin-bottom:14px }
  .back:hover{ color:var(--ink) }

  .hero{ display:grid; grid-template-columns:minmax(0,150px) minmax(0,1fr); gap:18px; align-items:start;
         border-bottom:1px solid var(--line); padding-bottom:20px }
  .hero__img{ width:100%; max-width:150px; aspect-ratio:.62; object-fit:cover; object-position:top center;
              border-radius:12px; background:var(--surface2) }
  .hero__kanji{ font-family:"Zen Kaku Gothic New",system-ui,sans-serif; font-weight:900;
                font-size:clamp(1.7rem,5vw,2.6rem); line-height:1.05; color:var(--gold) }
  .hero__name{ font-family:"Zen Kaku Gothic New",system-ui,sans-serif; font-weight:900;
               font-size:clamp(1.35rem,4vw,2rem); margin:2px 0 0; line-height:1.1 }
  .hero__rank{ margin-top:7px; font-size:1rem; color:var(--dim) }
  .hero__rank b{ color:var(--ink) }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:11px }
  .chip{ font-size:.74rem; font-family:"IBM Plex Mono",monospace; padding:3px 8px; border-radius:99px;
         border:1px solid var(--line); color:var(--dim); background:var(--surface) }
  .chip.up{ color:var(--win); border-color:color-mix(in srgb,var(--win) 40%,var(--line)) }
  .chip.down{ color:var(--loss); border-color:color-mix(in srgb,var(--loss) 40%,var(--line)) }
  .chip.alert{ color:var(--red); border-color:color-mix(in srgb,var(--red) 45%,var(--line)) }
  .chip.gold{ color:var(--gold); border-color:color-mix(in srgb,var(--gold) 45%,var(--line)) }

  .sect{ margin-top:26px }
  .sect h3{ font-family:"Zen Kaku Gothic New",system-ui,sans-serif; font-size:.98rem; margin:0 0 10px;
            color:var(--gold); letter-spacing:.02em }
  .prose{ margin:0; color:var(--dim); font-size:.94rem; line-height:1.55; max-width:68ch }
  .prose + .prose{ margin-top:9px }
  .prose.warn{ color:#f0c9c4 }

  .stats{ display:grid; gap:9px; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)) }
  .stat{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 11px }
  .stat dt{ color:var(--faint); font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; margin:0 }
  .stat dd{ margin:4px 0 0; font-size:1.02rem; font-weight:700; font-family:"IBM Plex Mono",monospace }
  .stat dd small{ font-size:.72rem; color:var(--muted); font-weight:500; margin-left:3px }

  .basho-row{ display:flex; flex-wrap:wrap; gap:8px }
  .basho{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 12px; min-width:104px }
  .basho i{ display:block; font-style:normal; color:var(--faint); font-size:.7rem; text-transform:uppercase; letter-spacing:.05em }
  .basho b{ display:block; font-family:"IBM Plex Mono",monospace; font-size:1.02rem; margin-top:3px }
  .basho b.kachi{ color:var(--win) } .basho b.make{ color:var(--loss) }

  /* head-to-head */
  .h2h{ display:flex; flex-wrap:wrap; gap:9px; align-items:center }
  .h2h select{ background:var(--surface); border:1px solid var(--line); color:var(--ink);
               border-radius:9px; padding:8px 10px; font:inherit; font-size:.9rem; max-width:100% }
  .h2h select:focus{ outline:0; border-color:var(--gold) }
  .h2h__out{ font-family:"IBM Plex Mono",monospace; font-size:.95rem; color:var(--dim) }
  .h2h__out b{ color:var(--ink); font-size:1.1rem }

  .empty{ color:var(--muted); font-size:.92rem }
  /* ── likely matchups ───────────────────────────────────── */
  .lm-note{ margin:0 0 12px; color:var(--muted); font-size:.84rem; line-height:1.5; max-width:70ch }
  .lm-note b{ color:var(--dim) }
  .lm{ width:100%; border-collapse:collapse; font-size:.88rem }
  .lm th, .lm td{ text-align:left; padding:6px 9px; border-bottom:1px solid var(--line) }
  .lm th{ color:var(--faint); font-weight:500; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em }
  .lm td{ color:var(--dim) }
  .lm td:first-child{ font-family:"IBM Plex Mono",monospace; color:var(--faint); width:3.2em }
  .lm a{ color:var(--ink); text-decoration:none; border-bottom:1px solid transparent }
  .lm a:hover{ border-bottom-color:var(--gold) }
  .lm-rank{ color:var(--faint); font-family:"IBM Plex Mono",monospace; font-size:.78rem; margin-left:4px }
  .lm-pct{ font-family:"IBM Plex Mono",monospace; color:var(--muted); width:4.5em }
  .lm-h2h{ font-family:"IBM Plex Mono",monospace; font-weight:600; width:7em }
  /* the word does the work; the percentage qualifies it and the colour only
     ever agrees with the two of them */
  .lm-edge{ width:9em; white-space:nowrap }
  .lm-edge b{ font-weight:600 }
  .lm-ep{ font-family:"IBM Plex Mono",monospace; font-size:.8rem; color:var(--faint) }
  .lm-up{ color:var(--win) } .lm-down{ color:var(--loss) }
  .lm-even{ color:var(--dim) } .lm-new{ color:var(--faint); font-weight:500 }
  .lm-none{ color:var(--faint) }

  /* ── career charts ─────────────────────────────────────── */
  .cc-tools{ display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; align-items:center; margin-bottom:12px }
  .cc-range{ display:flex; gap:6px }
  .cc-range button, .cc-tbtn{ background:var(--surface); border:1px solid var(--line); color:var(--muted);
    border-radius:8px; padding:6px 11px; font:inherit; font-size:.8rem; cursor:pointer }
  .cc-range button:hover, .cc-tbtn:hover{ border-color:var(--dim); color:var(--ink) }
  .cc-range button.on{ background:var(--surface2); border-color:var(--gold); color:var(--gold) }
  .cc-panel{ margin-bottom:10px }
  .cc-panel h4{ margin:0 0 3px; font-size:.8rem; font-weight:600; color:var(--dim);
    display:flex; justify-content:space-between; gap:10px; align-items:baseline }
  .cc-panel h4 span{ color:var(--faint); font-size:.72rem; font-family:"IBM Plex Mono",monospace; font-weight:500 }
  .cc-svg{ display:block; width:100%; height:auto; overflow:visible }
  .cc-cap{ margin:3px 0 0; color:var(--faint); font-size:.72rem }
  .cc-hint{ margin-top:8px; min-height:1.3em; color:var(--muted); font-size:.82rem;
    font-family:"IBM Plex Mono",monospace }
  .cc-hint b{ color:var(--ink) }
  .cc-out{ color:var(--loss) }
  .cc-table{ width:100%; border-collapse:collapse; margin-top:14px; font-size:.82rem;
    font-family:"IBM Plex Mono",monospace }
  .cc-table th, .cc-table td{ text-align:left; padding:5px 8px; border-bottom:1px solid var(--line) }
  .cc-table th{ color:var(--faint); font-weight:500; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em }
  .cc-table td{ color:var(--dim) }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap; border:0 }

  /* honours — headline counts, so stat tiles rather than a one-bar chart */
  .hn-tiles{ display:flex; flex-wrap:wrap; gap:8px }
  /* sized to their own content, not stretched: three tiles across a desktop
     column would otherwise put a single digit in the middle of 500px */
  .hn-tile{ flex:0 1 auto; min-width:124px; background:var(--surface);
            border:1px solid var(--line); border-radius:10px; padding:9px 11px }
  .hn-tile.hn-yusho{ border-color:color-mix(in srgb,var(--gold) 45%,var(--line)) }
  .hn-n{ font-family:"IBM Plex Mono",monospace; font-size:1.5rem; font-weight:600; color:var(--ink);
         line-height:1.05 }
  .hn-tile.hn-yusho .hn-n{ color:var(--gold) }
  .hn-k{ font-size:.82rem; font-weight:600; color:var(--dim); margin-top:1px }
  .hn-s{ font-size:.72rem; color:var(--faint) }
  .hn-none{ color:var(--muted); font-size:.85rem; margin:0 }
  .hn-career, .hn-divs{ display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:9px;
    font-size:.8rem; color:var(--muted); font-family:"IBM Plex Mono",monospace }
  .hn-career b{ color:var(--ink); font-weight:600 }
  .hn-divs{ gap:6px 12px; color:var(--faint); margin-top:5px }
  .hn-divs b{ color:var(--dim) }

  /* how he wins — HTML bars, not SVG: six rows with two-part labels reflow for
     free, the counts stay selectable text, and a label can never be clipped by
     a short bar the way a stacked segment's would be */
  .km-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:14px 22px }
  .km-panel h4{ margin:0 0 7px; font-size:.8rem; font-weight:600; color:var(--dim);
    display:flex; justify-content:space-between; gap:10px; align-items:baseline }
  .km-panel h4 span{ color:var(--faint); font-size:.72rem; font-weight:500;
    font-family:"IBM Plex Mono",monospace }
  .km-bars{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px }
  .km-bars li{ display:grid; grid-template-columns:minmax(0,1fr) 64px; gap:2px 10px; align-items:baseline }
  .km-lab{ min-width:0; font-size:.8rem; color:var(--dim) }
  .km-lab b{ font-weight:600; color:var(--ink) }
  .km-lab span{ color:var(--faint); font-size:.72rem }
  .km-track{ grid-column:1; height:9px; background:var(--surface2); border-radius:5px; overflow:hidden }
  .km-track i{ display:block; height:100%; border-radius:0 5px 5px 0; min-width:3px }
  .km-n{ grid-row:1 / span 2; grid-column:2; text-align:right; align-self:center;
    font-family:"IBM Plex Mono",monospace; font-size:.95rem; font-weight:600; color:var(--ink) }
  .km-n span{ display:block; font-size:.7rem; font-weight:500; color:var(--faint) }
  .km-table td:nth-child(3), .km-table td:nth-child(4),
  .km-table th:nth-child(3), .km-table th:nth-child(4){ text-align:right }

  /* rivals — records, so the number is always the primary tell and the colour
     only ever agrees with it */
  .rv-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px 22px }
  .rv-grid h4{ margin:0 0 6px; font-size:.8rem; font-weight:600; color:var(--dim) }
  .rv-list{ list-style:none; margin:0; padding:0 }
  .rv-list li{ display:flex; justify-content:space-between; gap:12px; align-items:baseline;
    padding:5px 0; border-bottom:1px solid var(--line) }
  .rv-list li:last-child{ border-bottom:0 }
  .rv-list a{ color:var(--ink); text-decoration:none; border-bottom:1px solid transparent }
  .rv-list a:hover{ border-bottom-color:var(--gold); color:var(--gold) }
  .rv-list b{ font-family:"IBM Plex Mono",monospace; font-size:.86rem; font-weight:600 }

  @media (max-width:560px){
    .hero{ grid-template-columns:96px minmax(0,1fr); gap:13px }
    .hero__img{ max-width:96px }
  }
</style>

or" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="tab-lab">Mock Draft</span></a></div></nav>

<script>
/* ── rikishi.html ───────────────────────────────────────────────────────────
   One page, two views: a directory of everyone on the banzuke, and a profile.

   Nothing here invents data. The curated dossier in gg-dossier.js already
   carries rank, stable, birthplace, measurements, career W-L, debut, career
   high, Elo, grade, signature techniques, the last three basho, and hand-
   written form and injury notes — it was simply never given a page of its own,
   only scout cards inside analysis.html. The live banzuke from GGRoster is
   layered on top so the rank and record are current rather than as-written.

   The one network call beyond that is head-to-head, and it happens only when
   somebody asks for a specific opponent. */
(function () {
  var view = document.getElementById("view");
  var GG = window.GyojiGuide || {};
  var LIVE = null;                       // name -> live banzuke row, once loaded
  var STARTED = false;                   // has the current basho actually begun?

  function esc(s){ return String(s == null ? "" : s)
    .replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function qs(){ try { return new URLSearchParams(location.search); } catch(e){ return { get:function(){return null;} }; } }

  /* Where the reader came from, so "back" means back. The Rikishi tab and the
     Banzuke tab both open profiles, and dumping everyone on Banzuke would make
     one of those two journeys lose its place every time. */
  var BACKS = { rikishi: ["analysis.html#rikishi", "All rikishi"],
                browse:  ["analysis.html#browse",  "Banzuke"] };
  function backLink(){
    var from = String(qs().get("from") || "rikishi");
    var b = BACKS[from] || BACKS.rikishi;
    return '<a class="back" href="' + b[0] + '">\u2190 ' + esc(b[1]) + '</a>';
  }

  /* ---------- data ---------- */
  function all(){
    var list = (window.GyojiGuide && GyojiGuide.RIKISHI) || (typeof R !== "undefined" ? R : []);
    return list || [];
  }
  function find(name){
    if (!name) return null;
    if (GG.rikishi) { var hit = GG.rikishi(name); if (hit) return hit; }
    var key = String(name).toLowerCase();
    return all().filter(function(r){ return String(r.n).toLowerCase() === key; })[0] || null;
  }
  function photo(n){ return "images/rikishi/" + n + ".webp"; }

  /* The dossier's `pid` is the NSK photo id — it is what analysis.html builds
     sumo.or.jp portrait URLs from, and it is NOT a sumo-api rikishi id. Passing
     it to /rikishi/{id}/matches/{id} returns HTTP 200 with every count zero, so
     head-to-head reported "no meetings on record" for every pair rather than
     failing loudly. The id sumo-api wants rides on the banzuke rows. */
  function apiId(r){
    var lv = liveOf(r.n);
    return (lv && lv.rikishiId) || null;
  }

  /* The dossier's `rank`/`live` were true when written. GGRoster has today's. */
  function liveOf(n){ return (LIVE && LIVE[n]) || null; }
  function rankText(r){
    var lv = liveOf(r.n);
    if (lv && lv.rankStr) return lv.rankStr;
    return (r.rank || "") + (r.num ? " " + r.num : "") + (r.side ? " " + (r.side === "E" ? "East" : "West") : "");
  }
  /* Two different records live here and conflating them is a lie either way.
     GGRoster only returns a record once a basho has actually started (it nulls
     0-0 rows rather than passing them off as results), so that one — and only
     that one — may be called "this basho". The dossier's is the most recent
     completed tournament. */
  function liveRecord(r){
    var lv = liveOf(r.n);
    return (STARTED && lv && lv.record) ? lv.record.replace(/-/g, "–") : "";
  }
  function pastRecord(r){
    return r.live ? String(r.live).replace(/-/g, "–") : "";
  }
  function recordText(r){ return liveRecord(r) || pastRecord(r); }
  function onBanzuke(r){ return !LIVE || !!liveOf(r.n); }

  /* The dossier writes rk as tier PLUS number — "M1", "J14" — while GGRoster
     normalises to a bare tier letter and a separate num. Everything that sorts
     or groups has to agree on one shape, so it comes through here. */
  function tierOf(r){
    var lv = liveOf(r.n);
    if (lv && lv.tier) return lv.tier;
    return String(r.rk || "M").charAt(0).toUpperCase();
  }
  function numOf(r){
    var lv = liveOf(r.n);
    if (lv && lv.num != null) return lv.num;
    var m = String(r.rk || "").match(/\d+/);
    return m ? Number(m[0]) : (Number(r.num) || 0);
  }
  function sideOf(r){
    var lv = liveOf(r.n);
    return String((lv && lv.side) || r.side || "e").charAt(0).toLowerCase();
  }

  /* ---------- directory ---------- */
  var TIER_ORDER = { Y:0, O:1, S:2, K:3, M:4, J:5 };
  function sortKey(r){
    var tier = tierOf(r);
    return (TIER_ORDER[tier] == null ? 9 : TIER_ORDER[tier]) * 1000 +
           numOf(r) * 2 + (sideOf(r) === "w" ? 1 : 0);
  }

  /* ---------- profile ---------- */
  function statBlock(r){
    var out = [];
    function add(label, value, note){
      if (value == null || value === "") return;
      out.push('<div class="stat"><dt>' + esc(label) + '</dt><dd>' + esc(value) +
               (note ? '<small>' + esc(note) + '</small>' : "") + '</dd></div>');
    }
    if (liveRecord(r)) add("This basho", liveRecord(r));
    else if (pastRecord(r)) add("Last basho", pastRecord(r));
    if (r.cw != null && r.cl != null) add("Career", r.cw + "–" + r.cl,
      (r.cw + r.cl) ? Math.round(r.cw / (r.cw + r.cl) * 100) + "%" : "");
    add("Career high", r.high);
    add("Debut", r.debut);
    if (r.age) add("Age", r.age);
    if (r.ht && r.wt) add("Build", r.ht + "cm", r.wt + "kg");
    if (r.elo) add("Elo", r.elo);
    if (r.grade) add("Grade", r.grade);
    return out.length ? '<dl class="stats">' + out.join("") + '</dl>' : "";
  }

  /* `live` is the most recent basho actually fought; `rec` holds the THREE
     BEFORE it, not including it (analysis.html derives its labels the same way,
     from FINISHED_BASHO_ID minus one). Treating rec[0] as "last basho" put two
     different figures under that heading on the same screen — the hero saying
     7-7-1 and the history saying 0-2-13. One continuous run instead. */
  function bashoBlock(r){
    var run = [];
    if (pastRecord(r)) run.push(pastRecord(r));
    (r.rec || []).forEach(function(v){ run.push(String(v).replace(/-/g, "–")); });
    if (!run.length) return "";
    return '<div class="basho-row">' + run.map(function(v, i){
      var parts = String(v).split("–").map(Number);
      var w = parts[0], l = parts[1];
      var cls = (w > l) ? "kachi" : (w < l) ? "make" : "";
      return '<div class="basho"><i>' + (i === 0 ? "Last basho" : (i + 1) + " basho ago") + '</i>' +
             '<b class="' + cls + '">' + esc(v) + '</b></div>';
    }).join("") + '</div>';
  }

  function chips(r){
    var out = [];
    var lv = liveOf(r.n);
    if (!onBanzuke(r)) out.push('<span class="chip alert">Not on the current banzuke</span>');
    if (r.lk) out.push('<span class="chip alert">Kyūjō</span>');
    /* `lv` carries four levels and is not decoration — projWins() reads it,
       zeroing an "out" and docking 1.7 / 0.7 / 0.2 wins for high / mid / iron.
       Only "out" was being rendered, so three quarters of the site's own
       health judgement never reached the page it belongs on. */
    var RISK = { out:  ["alert", "Out — expected to miss the basho"],
                 high: ["alert", "High injury risk"],
                 mid:  ["",      "Some injury risk"],
                 iron: ["gold",  "Iron man — no days missed in six basho"] };
    if (RISK[r.lv]) out.push('<span class="chip ' + RISK[r.lv][0] + '">' + esc(RISK[r.lv][1]) + '</span>');
    if (r.chg && r.chg.t && r.chg.d && r.chg.d !== "same")
      out.push('<span class="chip ' + (r.chg.d === "up" ? "up" : "down") + '">' + esc(r.chg.t) + '</span>');
    if (r.stable) out.push('<span class="chip">' + esc(r.stable) + ' stable</span>');
    if (r.from) out.push('<span class="chip">' + esc(r.from) + '</span>');
    (r.sig || []).forEach(function(s){ out.push('<span class="chip gold">' + esc(s) + '</span>'); });
    return out.length ? '<div class="chips">' + out.join("") + '</div>' : "";
  }

  function renderProfile(r){
    var rec = recordText(r);
    var html = backLink() +
      '<div class="hero">' +
        '<img class="hero__img" src="' + esc(photo(r.n)) + '" alt="' + esc(r.n) + '" ' +
          'onerror="this.style.visibility=\'hidden\'">' +
        '<div>' +
          (r.kanji ? '<div class="hero__kanji">' + esc(r.kanji) + '</div>' : "") +
          '<h1 class="hero__name">' + esc(r.n) + '</h1>' +
          '<div class="hero__rank"><b>' + esc(rankText(r)) + '</b>' +
            (liveRecord(r) ? ' · ' + esc(liveRecord(r)) + ' this basho'
                           : (pastRecord(r) ? ' · ' + esc(pastRecord(r)) + ' last basho' : "")) + '</div>' +
          chips(r) +
        '</div>' +
      '</div>';

    if (r.form || r.inj || r.note) {
      html += '<div class="sect"><h3>Form</h3>';
      if (r.form) html += '<p class="prose">' + esc(r.form) + '</p>';
      if (r.inj)  html += '<p class="prose warn">' + esc(r.inj) + '</p>';
      if (r.note) html += '<p class="prose">' + esc(r.note) + '</p>';
      html += '</div>';
    }

    var stats = statBlock(r);
    if (stats) html += '<div class="sect"><h3>By the numbers</h3>' + stats + '</div>';

    /* High on the page, because it is the first thing anyone wants to know
       about a wrestler they have not heard of. Each of these sections deletes
       itself if its request comes back empty, so a heading never sits over an
       apology. */
    html += '<div class="sect" id="hnSect"><h3>Honours</h3><div id="hnBody"></div></div>';

    var basho = bashoBlock(r);
    if (basho) html += '<div class="sect"><h3>Recent basho</h3>' + basho + '</div>';

    /* The old control asked you to pick an opponent. The useful question is
       which opponents he is going to GET, so the model answers that instead. */
    html += '<div class="sect" id="h2hSect"><h3>Likely matchups</h3><div id="h2hBody"></div></div>';
    html += '<div class="sect" id="ccSect"><h3>Career</h3><div id="ccBody"></div></div>';
    html += '<div class="sect" id="kmSect"><h3>How he wins and loses</h3><div id="kmBody"></div></div>';
    html += '<div class="sect" id="rvSect"><h3>Rivals</h3><div id="rvBody"></div></div>';

    view.innerHTML = html;
    describe(r);
    renderHonours(r);
    renderCareer(r);
    renderLikely(r);
    renderTechniques(r);
    renderRivals(r);
  }

  /* ── career charts ─────────────────────────────────────────────────────
     Three questions, three panels, one shared basho axis: where he ranked,
     how he scored, and how much he missed.

     Two requests build all of it. rankHistory gives one row per basho with a
     numeric rankValue that runs INVERTED — 101 Yokozuna, 201 Ozeki, 517
     Maegashira 17, 1019 Jonokuchi — so it is really banzuke position, with a
     division boundary every 100. The matches list gives every bout he ever
     fought; grouping it by bashoId yields his record, and the shortfall
     against a full card yields his absences (verified: 202605 comes back 0-2
     with 13 absent, matching the dossier's "0-2-13").

     One hue per panel and no green/red pair anywhere. Wins are a magnitude,
     so they get a single colour and the kachi-koshi line does the work of
     saying which basho were winning ones — colour is never the only channel,
     and the worst pair for colour-blind readers never appears. */
  var DIV_NAME = { 1:"Yokozuna", 2:"Ōzeki", 3:"Sekiwake", 4:"Komusubi", 5:"Maegashira",
                   6:"Jūryō", 7:"Makushita", 8:"Sandanme", 9:"Jonidan", 10:"Jonokuchi" };
  var DIV_SHORT = { 1:"Y", 2:"Ō", 3:"S", 4:"K", 5:"M", 6:"J", 7:"Ms", 8:"Sd", 9:"Jd", 10:"Jk" };
  var BASHO_NAME = { "01":"Hatsu", "03":"Haru", "05":"Natsu", "07":"Nagoya", "09":"Aki", "11":"Kyūshū" };

  function bashoLabel(id){
    var y = String(id).slice(0,4), m = String(id).slice(4,6);
    return (BASHO_NAME[m] || m) + " " + y;
  }
  function bashoShort(id){ return String(id).slice(2,4) + "’" + String(id).slice(0,2).slice(-2); }

  var careerCache = {};
  function fetchCareer(id){
    if (careerCache[id]) return careerCache[id];
    var base = "https://sumo-api.com/api/rikishi/" + encodeURIComponent(id);
    careerCache[id] = Promise.all([
      fetch(base + "?ranks=true").then(function(r){ return r.ok ? r.json() : null; }),
      fetch(base + "/matches").then(function(r){ return r.ok ? r.json() : null; })
    ]).then(function(pair){
      var prof = pair[0] || {}, mat = pair[1] || {};
      var rows = {};

      (prof.rankHistory || []).forEach(function(h){
        /* Mae-zumo (2000) and Banzuke-gai (3000) are not banzuke positions;
           plotting them squashes the entire real career into the top inch. */
        if (!h || Number(h.rankValue) >= 2000) return;
        rows[h.bashoId] = { bashoId:h.bashoId, rankValue:Number(h.rankValue),
                            rank:h.rank, w:0, l:0, bouts:0, division:"" };
      });

      /* Establish he was actually IN the bout before scoring it. Testing only
         `winnerId === id` treats every unrecognised row as a loss, so if the
         id were ever wrong the page would report a full career at 0% rather
         than showing nothing — a silent wrong answer of exactly the kind the
         head-to-head `pid` mixup already produced once. Not in the bout at
         all → skip it, and the panels come back empty and obviously so. */
      var me = String(id), seen = 0, mine = [];
      (mat.records || []).forEach(function(m){
        var isEast = String(m.eastId) === me, isWest = String(m.westId) === me;
        if (!isEast && !isWest) return;
        seen++;

        /* Every bout he fought, kept for the technique and rivalry panels.
           Gathered BEFORE the banzuke-row check below on purpose: a basho with
           no row — mae-zumo, or one rankHistory happens not to carry — is not
           on the chart, but those bouts still happened and still belong in his
           technique history. Only eastShikona/westShikona are read for the
           opponent; `winnerJp` is sometimes an <img> tag rather than a name,
           and nothing from this feed should be within reach of innerHTML. */
        mine.push({ bashoId: m.bashoId, day: Number(m.day) || 0,
                    division: m.division || "",
                    opp: String((isEast ? m.westShikona : m.eastShikona) || ""),
                    oppId: Number(isEast ? m.westId : m.eastId) || 0,
                    won: String(m.winnerId) === me,
                    kimarite: String(m.kimarite || "").toLowerCase() });

        var row = rows[m.bashoId];
        if (!row) return;                       // a basho with no banzuke row
        row.bouts++;
        row.division = row.division || m.division || "";
        if (String(m.winnerId) === me) row.w++; else row.l++;
      });
      if (!seen) return { series: [], records: [] };   // the id matched nothing

      var out = Object.keys(rows).sort().map(function(k){ return rows[k]; });
      out.forEach(function(row){
        /* the salaried divisions fight fifteen; everyone below fights seven */
        var div = Math.floor(row.rankValue / 100);
        row.full = (div <= 6) ? 15 : 7;
        row.absent = Math.max(0, row.full - row.bouts);
        row.label = bashoLabel(row.bashoId);
      });
      return { series: out, records: mine };
    }).catch(function(){ return null; });
    return careerCache[id];
  }

  /* ---------- drawing ---------- */
  var CC = { gold:"#d8b25a", loss:"#e2574c", grid:"#2a2e3a", ink:"#a7adbe", faint:"#6b7180" };

  function svgEl(w, h, cls, label){
    return '<svg class="' + cls + '" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h +
           '" role="img" aria-label="' + esc(label) + '">';
  }

  function panelRank(series, w, h, pad){
    var vals = series.map(function(d){ return d.rankValue; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    /* pad the domain out to whole divisions so the bands read as bands */
    lo = Math.floor(lo / 100) * 100; hi = Math.ceil(hi / 100) * 100;
    if (hi === lo) hi = lo + 100;
    var iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
    /* Band centres, matching the bar panels exactly — these are small
       multiples over one shared axis, so index i must land on the same x in
       all three or the crosshair reads one basho and points at another. */
    var step = iw / series.length;
    var x = function(i){ return pad.l + i*step + step/2; };
    var y = function(v){ return pad.t + (v - lo) / (hi - lo) * ih; };   // inverted by construction

    var s = svgEl(w, h, "cc-svg", "Rank by basho");
    /* Pointer events land on painted children only, so the empty space above
       the marks is deaf without a capture layer. fill="transparent" is paint
       with zero alpha — fill="none" is not and would not receive anything. */
    s += '<rect class="cc-hit" x="'+pad.l+'" y="0" width="'+iw+'" height="'+h+'" fill="transparent"/>';

    /* division bands, alternating, labelled at the left */
    for (var b = Math.floor(lo/100); b < Math.ceil(hi/100); b++){
      var y0 = y(b*100), y1 = y((b+1)*100);
      if (b % 2 === 1) s += '<rect x="'+pad.l+'" y="'+y0.toFixed(1)+'" width="'+iw+'" height="'+(y1-y0).toFixed(1)+'" fill="#ffffff" opacity=".025"/>';
      s += '<line x1="'+pad.l+'" x2="'+(pad.l+iw)+'" y1="'+y0.toFixed(1)+'" y2="'+y0.toFixed(1)+'" stroke="'+CC.grid+'" stroke-width="1"/>';
      if (y1 - y0 > 13)
        s += '<text x="'+(pad.l-6)+'" y="'+((y0+y1)/2+3.5).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="'+CC.faint+'">'+
             esc(DIV_SHORT[b] || "")+'</text>';
    }

    /* A real step: a rank is held for the whole basho and then jumps. Drawing
       a diagonal between two basho would show him gliding through ranks he
       never held. */
    var d = "", half = step/2;
    series.forEach(function(pt, i){
      var py = y(pt.rankValue), l = x(i) - half, rgt = x(i) + half;
      d += (i === 0 ? "M" : "L") + l.toFixed(1) + " " + py.toFixed(1);
      d += "L" + rgt.toFixed(1) + " " + py.toFixed(1);
      if (i < series.length - 1) d += "L" + rgt.toFixed(1) + " " + y(series[i+1].rankValue).toFixed(1);
    });
    s += '<path d="'+d+'" fill="none" stroke="'+CC.gold+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';

    /* label only the extreme and the endpoint, never every point */
    var bestI = 0;
    series.forEach(function(pt,i){ if (pt.rankValue < series[bestI].rankValue) bestI = i; });
    var last = series.length - 1;
    [[bestI,"best"],[last,"now"]].forEach(function(pair){
      var i = pair[0], pt = series[i];
      s += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(pt.rankValue).toFixed(1)+'" r="3.4" fill="'+CC.gold+'" stroke="#181a22" stroke-width="2"/>';
    });
    /* The best rank is usually the top of the plot, so a label placed above it
       escapes the SVG (overflow is visible) and lands on the panel heading.
       Flip it under the point when there is no room over it. */
    var bp = series[bestI], by = y(bp.rankValue);
    var above = by - pad.t > 14;
    s += '<text x="'+Math.min(x(bestI)+7, w-pad.r-4)+'" y="'+(above ? by-7 : by+13).toFixed(1)+
         '" font-size="10" fill="'+CC.ink+'" text-anchor="'+(bestI > series.length*0.7 ? "end" : "start")+'">'+
         esc(bp.rank)+'</text>';
    return s + '</svg>';
  }

  function panelBars(series, w, h, pad, key, colour, maxOverride, threshold, label){
    var iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
    var max = maxOverride || Math.max(1, Math.max.apply(null, series.map(function(d){ return d[key]; })));
    var step = iw / series.length;
    var bw = Math.max(1.5, Math.min(18, step - 2));           // a 2px gap between bars
    var y = function(v){ return pad.t + ih - (v / max) * ih; };
    var s = svgEl(w, h, "cc-svg", label);
    /* Pointer events land on painted children only, so the empty space above
       the marks is deaf without a capture layer. fill="transparent" is paint
       with zero alpha — fill="none" is not and would not receive anything. */
    s += '<rect class="cc-hit" x="'+pad.l+'" y="0" width="'+iw+'" height="'+h+'" fill="transparent"/>';

    /* Tick the threshold itself rather than a meaningless midpoint — the
       reader wants to know where 8 is, not where 7.5 is. */
    var ticks = threshold ? [0, threshold, max] : [0, max/2, max];
    ticks.forEach(function(v){
      s += '<line x1="'+pad.l+'" x2="'+(pad.l+iw)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'" stroke="'+CC.grid+'" stroke-width="1"/>';
      s += '<text x="'+(pad.l-6)+'" y="'+(y(v)+3.5).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="'+CC.faint+'">'+v+'</text>';
    });

    series.forEach(function(d, i){
      var v = d[key]; if (!v) return;
      var bx = pad.l + i*step + (step - bw)/2, by = y(v), bh = pad.t + ih - by;
      var r = Math.min(3, bw/2);
      s += '<rect x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+
           '" rx="'+r.toFixed(1)+'" fill="'+colour+'" opacity="'+(threshold && v < threshold ? ".6" : "1")+'"/>';
    });

    /* The threshold is a threshold, so it is the one dashed line here. Its
       label lives in the caption, not floating in the plot — at phone width
       the bars reach both edges and any in-plot label lands on top of one. */
    if (threshold){
      s += '<line x1="'+pad.l+'" x2="'+(pad.l+iw)+'" y1="'+y(threshold).toFixed(1)+'" y2="'+y(threshold).toFixed(1)+
           '" stroke="'+CC.gold+'" stroke-width="1.5" stroke-dasharray="4 3" opacity=".85"/>';
    }
    return s + '</svg>';
  }

  function xAxis(series, w, pad){
    var iw = w - pad.l - pad.r, step = iw / series.length;
    var s = svgEl(w, 18, "cc-svg cc-axis", "Basho");
    var every = Math.max(1, Math.ceil(series.length / 8));
    series.forEach(function(d, i){
      if (i % every) return;
      var cx = pad.l + i*step + step/2;
      var MON = { "01":"Jan", "03":"Mar", "05":"May", "07":"Jul", "09":"Sep", "11":"Nov" };
      var bid = String(d.bashoId);
      s += '<text x="'+cx.toFixed(1)+'" y="12" text-anchor="middle" font-size="9.5" fill="'+CC.faint+'">'+
           esc((MON[bid.slice(4,6)] || bid.slice(4,6)) + " " + bid.slice(2,4))+'</text>';
    });
    return s + '</svg>';
  }

  function careerTable(series){
    var rows = series.slice().reverse().map(function(d){
      return '<tr><td>'+esc(d.label)+'</td><td>'+esc(d.rank||"")+'</td><td>'+d.w+'–'+d.l+
             (d.absent ? '–'+d.absent : '')+'</td><td>'+d.absent+'</td></tr>';
    }).join("");
    return '<table class="cc-table"><caption class="sr-only">Rank, record and days absent by basho</caption>' +
      '<thead><tr><th>Basho</th><th>Rank</th><th>Record</th><th>Absent</th></tr></thead><tbody>' +
      rows + '</tbody></table>';
  }

  function renderCareer(r){
    var host = document.getElementById("ccBody");
    if (!host) return;
    var id = apiId(r);
    if (!id){ host.innerHTML = '<p class="empty">Career history needs the live banzuke, which didn’t load.</p>'; return; }

    host.innerHTML = '<p class="empty">Reading his career…</p>';
    fetchCareer(id).then(function(career){
      var series = career && career.series;
      if (!series || !series.length){
        host.innerHTML = '<p class="empty">No career history came back for him.</p>'; return;
      }
      var state = { n: 24, table: false };

      function paint(){
        var win = state.n ? series.slice(-state.n) : series;
        var w = Math.max(280, host.clientWidth || 640);
        var padL = 30, pad = { l:padL, r:10, t:8, b:6 };

        var careerW = series.reduce(function(a,d){ return a + d.w; }, 0);
        var careerL = series.reduce(function(a,d){ return a + d.l; }, 0);
        var pct = (careerW + careerL) ? Math.round(careerW/(careerW+careerL)*100) : 0;

        host.innerHTML =
          '<div class="cc-tools">' +
            '<div class="cc-range" role="group" aria-label="How far back">' +
              [[12,"12 basho"],[24,"24 basho"],[0,"Career"]].map(function(o){
                return '<button type="button" data-n="'+o[0]+'"'+(state.n===o[0]?' class="on" aria-pressed="true"':' aria-pressed="false"')+'>'+o[1]+'</button>';
              }).join("") +
            '</div>' +
            '<button type="button" class="cc-tbtn" id="ccToggle" aria-pressed="'+(state.table?'true':'false')+'">'+
              (state.table ? "Hide table" : "Show table")+'</button>' +
          '</div>' +

          '<div class="cc-panel"><h4>Rank<span>'+esc(win[0].label)+' → '+esc(win[win.length-1].label)+'</span></h4>' +
            panelRank(win, w, 128, pad) + '</div>' +
          '<div class="cc-panel"><h4>Wins per basho<span>career '+careerW+'–'+careerL+' · '+pct+'%</span></h4>' +
            panelBars(win, w, 88, pad, "w", CC.gold, 15, 8, "Wins by basho") +
            '<p class="cc-cap">Dashed line: 8 wins — kachi-koshi. Dimmed bars are losing records.</p></div>' +
          '<div class="cc-panel"><h4>Days absent<span>'+series.reduce(function(a,d){return a+d.absent;},0)+' career days missed</span></h4>' +
            panelBars(win, w, 66, pad, "absent", CC.loss, 15, 0, "Days absent by basho") + '</div>' +
          xAxis(win, w, pad) +
          '<div class="cc-hint" id="ccHint">Hover a basho for the detail.</div>' +
          (state.table ? careerTable(win) : "");

        host.querySelectorAll(".cc-range button").forEach(function(btn){
          btn.onclick = function(){ state.n = Number(btn.dataset.n); paint(); };
        });
        var tg = document.getElementById("ccToggle");
        if (tg) tg.onclick = function(){ state.table = !state.table; paint(); };

        /* one crosshair for all three panels — they share an x, so a single
           readout beats three separate tooltips */
        var hint = document.getElementById("ccHint");
        var iw = w - pad.l - pad.r, step = iw / win.length;
        host.querySelectorAll(".cc-svg").forEach(function(sv){
          sv.addEventListener("mousemove", function(ev){
            var box = sv.getBoundingClientRect();
            var i = Math.floor(((ev.clientX - box.left) * (w / box.width) - pad.l) / step);
            if (i < 0 || i >= win.length) return;
            var d = win[i];
            hint.innerHTML = '<b>'+esc(d.label)+'</b> · '+esc(d.rank||"")+' · '+
              d.w+'–'+d.l+(d.absent ? '–'+d.absent : '')+
              (d.absent ? ' · <span class="cc-out">'+d.absent+' absent</span>' : '');
          });
          sv.addEventListener("mouseleave", function(){ hint.textContent = "Hover a basho for the detail."; });
        });
      }

      paint();
      var t = null;
      window.addEventListener("resize", function(){ clearTimeout(t); t = setTimeout(paint, 180); });
    });
  }

  /* ── honours ───────────────────────────────────────────────────────────
     `/stats` is a small, separate document from the two the career charts
     read, and it holds the things a career is actually remembered for: yūshō,
     the three sanshō, and how much of the career was spent hurt.

     It is NOT reconciled against the career charts on purpose. `/stats` counts
     258 matches for Onosato where `/matches` returns 261 records; the two
     disagree about forfeits and drawn bouts. Each panel is therefore computed
     from ONE source and says so, rather than adding figures from both and
     producing a total that matches neither. */
  var SANSHO = [
    ["Shukun-sho", "Shukun-shō", "Outstanding Performance"],
    ["Kanto-sho",  "Kantō-shō",  "Fighting Spirit"],
    ["Gino-sho",   "Ginō-shō",   "Technique"]
  ];
  var statsCache = {};
  function fetchStats(id){
    if (statsCache[id]) return statsCache[id];
    statsCache[id] = fetch("https://sumo-api.com/api/rikishi/" + encodeURIComponent(id) + "/stats")
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; });
    return statsCache[id];
  }

  function divLine(byDiv){
    if (!byDiv) return "";
    var keys = Object.keys(byDiv).filter(function(k){ return Number(byDiv[k]) > 0; });
    if (!keys.length) return "";
    /* highest division first — the object arrives alphabetical, which puts
       Jonokuchi above Makuuchi and reads like a demotion */
    var ORDER = ["Makuuchi","Juryo","Makushita","Sandanme","Jonidan","Jonokuchi"];
    var PRETTY = { Juryo:"Jūryō", Makushita:"Makushita", Sandanme:"Sandanme",
                   Jonidan:"Jonidan", Jonokuchi:"Jonokuchi", Makuuchi:"Makuuchi" };
    keys.sort(function(a,b){
      var ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    return keys.map(function(k){
      return '<span class="hn-div"><b>' + byDiv[k] + '</b> ' + esc(PRETTY[k] || k) + '</span>';
    }).join("");
  }

  function renderHonours(r){
    var host = document.getElementById("hnBody");
    if (!host) return;
    var id = apiId(r);
    if (!id){ host.innerHTML = '<p class="empty">Career honours need the live banzuke, which didn’t load.</p>'; return; }

    host.innerHTML = '<p class="empty">Reading his record book…</p>';
    fetchStats(id).then(function(s){
      var sect = document.getElementById("hnSect");
      if (!s || !s.totalMatches){
        /* Nothing to show is not the same as a broken panel. Drop the whole
           section rather than leave a heading over an apology. */
        if (sect) sect.remove();
        return;
      }

      var prizes = SANSHO.filter(function(p){ return Number((s.sansho || {})[p[0]]) > 0; });
      var tiles = "";
      if (Number(s.yusho) > 0)
        tiles += '<div class="hn-tile hn-yusho"><div class="hn-n">' + s.yusho + '</div>' +
                 '<div class="hn-k">Yūshō</div><div class="hn-s">' +
                 esc(Object.keys(s.yushoByDivision || {}).map(function(d){
                   return (d === "Juryo" ? "Jūryō" : d) + " " + s.yushoByDivision[d];
                 }).join(" · ")) + '</div></div>';
      prizes.forEach(function(p){
        tiles += '<div class="hn-tile"><div class="hn-n">' + s.sansho[p[0]] + '</div>' +
                 '<div class="hn-k">' + esc(p[1]) + '</div><div class="hn-s">' + esc(p[2]) + '</div></div>';
      });

      var w = Number(s.totalWins) || 0, l = Number(s.totalLosses) || 0;
      var pct = (w + l) ? Math.round(w / (w + l) * 100) : 0;

      host.innerHTML =
        (tiles ? '<div class="hn-tiles">' + tiles + '</div>'
               : '<p class="hn-none">No yūshō or sanshō yet.</p>') +
        '<div class="hn-career">' +
          '<span><b>' + s.basho + '</b> basho</span>' +
          '<span><b>' + w + '–' + l + '</b> ' + pct + '%</span>' +
          '<span><b>' + (Number(s.totalAbsences) || 0) + '</b> days missed</span>' +
        '</div>' +
        (divLine(s.bashoByDivision) ? '<div class="hn-divs">' + divLine(s.bashoByDivision) + '</div>' : "");
    });
  }

  /* ── how he wins, and how he loses ─────────────────────────────────────
     The winning move of every bout is on the record, and the career charts
     already pull all of them to count wins per basho — they were being thrown
     away after the tally. So this panel costs no extra request at all.

     Three things this does that a naive count would get wrong:

     1. `fusen` is a forfeit and `hansoku` a disqualification. Neither is a
        technique and neither happened on the dohyō, so they are pulled out of
        the split and reported separately. Onosato has four fusen wins; folded
        in, they would sit above tsukidashi in his top techniques.
     2. The five hiwaza — isamiashi, koshikudake, fumidashi, tsukihiza,
        tsukite — are the OPPONENT's mistake, not the winner's move. They get
        their own row rather than being scattered through the families, so
        "won by the other man stepping out" never reads as a technique he owns.
     3. The families are the NSK's own six, not a folk grouping. Which means
        hatakikomi sits under tokushu-waza where a fan might expect a "pulling"
        bucket — so every technique is also listed by name in the table, where
        its family is spelled out.

     Anything the map does not know falls into "Other" AND is named in the
     table. A new kimarite added by the Association degrades to an honest
     "Other" row instead of being silently dropped or silently misfiled. */
  var KIMARITE_FAMILY = (function(){
    var m = {};
    function add(fam, names){ names.forEach(function(n){ m[n] = fam; }); }
    add("kihon",   ["abisetaoshi","oshidashi","oshitaoshi","tsukidashi","tsukitaoshi",
                    "yorikiri","yoritaoshi"]);
    add("nage",    ["dashinage","ipponzeoi","kakenage","koshinage","kotenage","kubinage",
                    "nichonage","shitatedashinage","shitatenage","sukuinage","tsukaminage",
                    "uwatedashinage","uwatenage","yaguranage"]);
    add("kake",    ["ashitori","chongake","kawazugake","kekaeshi","ketaguri","kirikaeshi",
                    "komatasukui","kozumatori","mitokorozeme","nimaigeri","omata","sotogake",
                    "sotokomata","susoharai","susotori","tsumatori","uchigake","watashikomi",
                    /* sorite — backward body drops. Three in the whole database and
                       none in a modern career; a row of their own would always be
                       empty, so they ride with the other leg-and-body attacks. */
                    "izori","tasukizori","tsutaezori"]);
    add("hineri",  ["gasshohineri","harimanage","kainahineri","katasukashi","kotehineri",
                    "kubihineri","makiotoshi","osakate","sakatottari","shitatehineri",
                    "sotomuso","tokkurinage","tottari","tsukiotoshi","uchimuso","uwatehineri",
                    "zubuneri"]);
    add("tokushu", ["amiuchi","hatakikomi","hikiotoshi","hikkake","kimedashi","kimetaoshi",
                    "okurigake","okurihikiotoshi","okurinage","okuridashi","okuritaoshi",
                    "okuritsuridashi","okuritsuriotoshi","sabaori","sokubiotoshi","tsuridashi",
                    "tsuriotoshi","ushiromotare","utchari","waridashi","yobikaeshi","yobimodoshi"]);
    add("hiwaza",  ["fumidashi","isamiashi","koshikudake","tsukihiza","tsukite"]);
    add("nobout",  ["fusen","hansoku","hikiwake","itamiwake"]);
    return m;
  })();

  var FAMILIES = [
    { k:"kihon",   ja:"Kihon-waza",   en:"force-out & push-out" },
    { k:"nage",    ja:"Nage-te",      en:"throws" },
    { k:"hineri",  ja:"Hineri-te",    en:"twists & twist-downs" },
    { k:"kake",    ja:"Kake-te",      en:"trips & leg attacks" },
    { k:"tokushu", ja:"Tokushu-waza", en:"special techniques" },
    { k:"hiwaza",  ja:"Hiwaza",       en:"opponent’s own error" },
    { k:"unrec",   ja:"Unrecorded",   en:"the finish was never published" },
    { k:"other",   ja:"Other",        en:"not in the technique list" }
  ];

  /* A blank kimarite is not an unknown technique — it is a real bout whose
     finish the Association never published. Mae-zumo is never given one, and
     neither is a day-16 championship playoff (Aonishiki beat Atamifuji in the
     Nagoya 2026 playoff; that row comes back with an empty kimarite and a real
     winner). Both count as wins and losses, so they stay in the totals, but
     filing them under "Other" would claim a move was used that nobody recorded. */
  function famOf(k){ return !k ? "unrec" : (KIMARITE_FAMILY[k] || "other"); }

  /* Romaji as the Association writes it, for the handful common enough that a
     bare transliteration would be the only thing on screen. Everything else
     shows as-is — an honest transliteration beats a guessed macron. */
  var KIM_PRETTY = { yorikiri:"yorikiri", oshidashi:"oshidashi", hatakikomi:"hatakikomi",
                     yoritaoshi:"yoritaoshi", oshitaoshi:"oshitaoshi", tsukiotoshi:"tsukiotoshi",
                     hikiotoshi:"hikiotoshi", uwatenage:"uwatenage", shitatenage:"shitatenage",
                     okuridashi:"okuridashi", tsukidashi:"tsukidashi", sukuinage:"sukuinage",
                     katasukashi:"katasukashi", tsuridashi:"tsuridashi", kotenage:"kotenage",
                     fusen:"fusen (forfeit)", hansoku:"hansoku (foul)",
                     hikiwake:"hikiwake (draw)", itamiwake:"itamiwake (injury draw)" };
  function kimName(k){ return KIM_PRETTY[k] || k || "unrecorded"; }

  function techSplit(records){
    var fam = {}, tech = {}, off = { w:0, l:0 }, tot = { w:0, l:0 };
    FAMILIES.forEach(function(f){ fam[f.k] = { w:0, l:0 }; });
    (records || []).forEach(function(m){
      var k = String(m.kimarite || "").toLowerCase();
      var f = famOf(k);
      var side = m.won ? "w" : "l";
      (tech[k] = tech[k] || { w:0, l:0, fam:f })[side]++;
      if (f === "nobout"){ off[side]++; return; }   // never happened on the dohyo
      fam[f][side]++;
      tot[side]++;
    });
    return { fam: fam, tech: tech, off: off, tot: tot };
  }

  /* Plain HTML bars rather than SVG. Six rows with long two-part labels reflow
     for free this way, the counts are real selectable text, and the labels can
     never be clipped by a short bar — which is the failure a stacked segment
     would have had here, where kihon-waza is two-thirds of every career and
     everything else is a sliver.

     One hue per panel, as everywhere else on this page. Wins and losses are
     never on one axis together: darkening the gold enough to sit beside the
     red in a shared chart collapses the pair under deuteranopia, and the
     lightness gap is exactly what keeps them apart. Two panels, no legend
     needed — each heading names its one series. */
  function famPanel(split, side, colour, title){
    var rows = FAMILIES.map(function(f){
      var c = split.fam[f.k] || { w:0, l:0 };
      return { f:f, n: c[side], both: c.w + c.l };
    }).filter(function(row){ return row.both > 0; });

    /* Shared order across both panels — sorted by how often the family shows
       up at all — so a row sits at the same height in each and the two can be
       read against one another. Sorting each panel independently would make
       the top row of one mean nothing about the top row of the other. */
    rows.sort(function(a, b){ return b.both - a.both || a.f.k.localeCompare(b.f.k); });

    var total = split.tot[side];
    var max = rows.reduce(function(a, row){ return Math.max(a, row.n); }, 0) || 1;
    if (!total) return '<div class="km-panel"><h4>' + esc(title) + '</h4>' +
      '<p class="empty">Nothing recorded.</p></div>';

    return '<div class="km-panel"><h4>' + esc(title) + '<span>' + total + '</span></h4>' +
      '<ul class="km-bars">' + rows.map(function(row){
        var pct = Math.round(row.n / total * 100);
        return '<li>' +
          '<div class="km-lab"><b>' + esc(row.f.ja) + '</b> <span>' + esc(row.f.en) + '</span></div>' +
          /* a family he has never been beaten by keeps its row — that absence is
             the interesting part — but draws no bar. The minimum width that
             keeps a count of 1 visible would otherwise render zero as a stub,
             which reads as "hardly ever" rather than "never". */
          '<div class="km-track">' + (row.n
            ? '<i style="width:' + (row.n / max * 100).toFixed(1) + '%;background:' + colour + '"></i>'
            : '') + '</div>' +
          '<div class="km-n">' + row.n + '<span>' + pct + '%</span></div>' +
        '</li>';
      }).join("") + '</ul></div>';
  }

  function techTable(split){
    var names = Object.keys(split.tech).sort(function(a, b){
      var A = split.tech[a], B = split.tech[b];
      return (B.w + B.l) - (A.w + A.l) || a.localeCompare(b);
    });
    var byKey = {};
    FAMILIES.forEach(function(f){ byKey[f.k] = f.ja; });
    byKey.nobout = "—";
    byKey.unrec = "Unrecorded";
    return '<table class="cc-table km-table">' +
      '<caption class="sr-only">Every recorded finishing move, with wins and losses</caption>' +
      '<thead><tr><th>Kimarite</th><th>Family</th><th>Won by</th><th>Lost to</th></tr></thead><tbody>' +
      names.map(function(k){
        var t = split.tech[k];
        return '<tr><td>' + esc(kimName(k)) + '</td><td>' + esc(byKey[t.fam] || "Other") +
               '</td><td>' + (t.w || "—") + '</td><td>' + (t.l || "—") + '</td></tr>';
      }).join("") + '</tbody></table>';
  }

  function renderTechniques(r){
    var host = document.getElementById("kmBody");
    if (!host) return;
    var id = apiId(r);
    if (!id){ host.innerHTML = '<p class="empty">Technique history needs the live banzuke, which didn’t load.</p>'; return; }

    host.innerHTML = '<p class="empty">Counting how he finishes…</p>';
    fetchCareer(id).then(function(career){
      var recs = career && career.records;
      var sect = document.getElementById("kmSect");
      if (!recs || !recs.length){ if (sect) sect.remove(); return; }

      var split = techSplit(recs);
      var state = { table: false };

      function paint(){
        host.innerHTML =
          '<div class="km-grid">' +
            famPanel(split, "w", CC.gold, "Won by") +
            famPanel(split, "l", CC.loss, "Lost to") +
          '</div>' +
          '<p class="cc-cap">' + (split.tot.w + split.tot.l) + ' bouts decided on the dohyō' +
            (split.off.w || split.off.l
              ? ', plus ' + split.off.w + ' won and ' + split.off.l +
                ' lost by forfeit or foul, which are left out of the split above'
              : '') + '.</p>' +
          '<div class="cc-tools"><button type="button" class="cc-tbtn" id="kmToggle" aria-pressed="' +
            (state.table ? "true" : "false") + '">' +
            (state.table ? "Hide every technique" : "Show every technique") + '</button></div>' +
          (state.table ? techTable(split) : "");
        var tg = document.getElementById("kmToggle");
        if (tg) tg.onclick = function(){ state.table = !state.table; paint(); };
      }
      paint();
    });
  }

  /* ── who he owns, and who owns him ─────────────────────────────────────
     Also free: the same career records carry the opponent of every bout.

     A rivalry needs repetition. One meeting is a result, not a record, so
     anything under three is left out entirely rather than shown as a
     meaningless 1–0 — and the note says so, because "no rivals" and "nobody
     he has met three times" are different statements. */
  var RIVAL_MIN = 3;
  function rivalSplit(records){
    var by = {};
    (records || []).forEach(function(m){
      if (!m.opp) return;
      var o = by[m.opp] = by[m.opp] || { n:m.opp, w:0, l:0 };
      m.won ? o.w++ : o.l++;
    });
    var all = Object.keys(by).map(function(k){ return by[k]; })
      .filter(function(o){ return o.w + o.l >= RIVAL_MIN; });
    var owns = all.filter(function(o){ return o.w > o.l; })
      .sort(function(a,b){ return (b.w-b.l) - (a.w-a.l) || b.w - a.w; });
    var owned = all.filter(function(o){ return o.l > o.w; })
      .sort(function(a,b){ return (b.l-b.w) - (a.l-a.w) || b.l - a.l; });
    return { owns: owns.slice(0, 6), owned: owned.slice(0, 6), pool: all.length };
  }

  function rivalList(rows, cls, empty){
    if (!rows.length) return '<p class="empty">' + esc(empty) + '</p>';
    var from = String(qs().get("from") || "rikishi");
    return '<ul class="rv-list">' + rows.map(function(o){
      var known = !!find(o.n);
      var label = known
        ? '<a href="rikishi.html?n=' + encodeURIComponent(o.n) + '&from=' + esc(from) + '">' + esc(o.n) + '</a>'
        : esc(o.n);
      return '<li>' + label + '<b class="' + cls + '">' + o.w + '–' + o.l + '</b></li>';
    }).join("") + '</ul>';
  }

  function renderRivals(r){
    var host = document.getElementById("rvBody");
    if (!host) return;
    var id = apiId(r);
    if (!id){ host.innerHTML = '<p class="empty">Rivalries need the live banzuke, which didn’t load.</p>'; return; }

    host.innerHTML = '<p class="empty">Looking up his rivals…</p>';
    fetchCareer(id).then(function(career){
      var recs = career && career.records;
      var sect = document.getElementById("rvSect");
      if (!recs || !recs.length){ if (sect) sect.remove(); return; }

      var s = rivalSplit(recs);
      if (!s.pool){
        host.innerHTML = '<p class="empty">He has not met anyone ' + RIVAL_MIN +
          ' times yet — too early for a rivalry.</p>';
        return;
      }
      host.innerHTML =
        '<div class="rv-grid">' +
          '<div><h4>He owns</h4>' +
            rivalList(s.owns, "lm-up", "Nobody he has met " + RIVAL_MIN + " times is behind him.") + '</div>' +
          '<div><h4>They own him</h4>' +
            rivalList(s.owned, "lm-down", "Nobody he has met " + RIVAL_MIN + " times is ahead of him.") + '</div>' +
        '</div>' +
        '<p class="cc-cap">Career meetings, from ' + s.pool + ' opponent' + (s.pool === 1 ? "" : "s") +
        ' he has faced at least ' + RIVAL_MIN + ' times. Even records are left out.</p>';
    });
  }

  /* ── what a link to this page says it is ───────────────────────────────
     Every profile shipped the directory's description, so seventy-odd pages
     told Google and every chat client the same thing about themselves. Each
     man now describes himself, with the portrait as the preview image and a
     canonical URL that names the query string as part of the page's identity.

     Worth knowing where this stops: this runs in the browser. Google renders
     JavaScript and will see it; most chat and social unfurlers do not, and
     will keep reading the static tags in the file. Fixing that needs
     prerendering at the edge, not more client-side code. */
  var SITE = "https://sumoslapdown.com";
  function meta(sel, attr, val, key){
    var el = document.head.querySelector(sel);
    if (!el){
      el = document.createElement(sel.indexOf("link") === 0 ? "link" : "meta");
      el.setAttribute(attr, key);
      document.head.appendChild(el);
    }
    el.setAttribute(sel.indexOf("link") === 0 ? "href" : "content", val);
  }
  function describe(r){
    var bits = [rankText(r)];
    var rec = liveRecord(r) ? liveRecord(r) + " this basho"
            : (pastRecord(r) ? pastRecord(r) + " last basho" : "");
    if (rec) bits.push(rec);
    if (r.stable) bits.push(r.stable + " stable");
    if (r.from) bits.push("from " + r.from);
    var desc = r.n + " — " + bits.join(", ") +
      ". Career record, rank history, likely matchups and how he wins.";

    document.title = r.n + " · Sumo Slapdown";
    meta('meta[name="description"]', "name", desc, "description");
    meta('meta[property="og:title"]', "property", r.n + " · Sumo Slapdown", "og:title");
    meta('meta[property="og:description"]', "property", desc, "og:description");
    meta('meta[property="og:type"]', "property", "profile", "og:type");
    meta('meta[property="og:url"]', "property", SITE + "/rikishi.html?n=" + encodeURIComponent(r.n), "og:url");
    /* Open Graph image URLs must be absolute — a relative one is silently
       ignored by every unfurler, which is exactly how a preview ends up with no
       picture and no error anywhere. canonical and og:url are already absolute;
       this one was not. */
    meta('meta[property="og:image"]', "property",
         new URL(photo(r.n), SITE + "/").href, "og:image");
    meta('meta[name="twitter:card"]', "name", "summary", "twitter:card");
    meta('link[rel="canonical"]', "rel", SITE + "/rikishi.html?n=" + encodeURIComponent(r.n), "canonical");
  }

  /* ── likely matchups ───────────────────────────────────────────────────
     Who is he actually going to face? The site already owns a model of that:
     the matchmaking engine that builds the simulator's card, now shared as
     gg-torikumi.js. It is fed the live banzuke rather than the simulator's
     roster, and asked the same question the schedulers answer each morning.

     One run of that model is ONE plausible bracket, not a schedule — after day
     one the pairings depend on how everybody has been doing, which the model
     decides with a die. So this runs it many times and reports how often each
     opponent turns up on each day. A man who appears in most runs is genuinely
     likely; one who appears in a third is a coin toss, and the page says so
     rather than presenting either as a fixture. */
  var TK_RUNS = 25;                       // ~11ms each; the whole sweep is well under half a second
  var tkEngine = null;
  function buildEngine(){
    if (tkEngine !== null) return tkEngine;
    tkEngine = false;
    if (!window.GGTorikumi || !LIVE) return tkEngine;
    var ROSTER = {}, BYDIV = { makuuchi:[], juryo:[] };
    Object.keys(LIVE).forEach(function(n){
      var row = LIVE[n] || {}, dos = (GG.rikishi && GG.rikishi(n)) || {};
      var d = row.div === "juryo" ? "juryo" : "makuuchi";
      if (!row.code) return;
      ROSTER[n] = { d:d, code:row.code,
                    elo: Number(dos.elo) || 2200,
                    stable: dos.stable || "",
                    sig: (dos.sig && dos.sig.length) ? dos.sig : ["oshi"] };
      BYDIV[d].push(n);
    });
    if (!BYDIV.makuuchi.length) return tkEngine;
    tkEngine = GGTorikumi.create({
      ROSTER: ROSTER, ROSTER_BY_DIV: BYDIV, BASHO_DAYS: 15,
      RANK_ORDER: { Y:0, O:1, S:2, K:3, M:4, J:5 },
      REAL_SNAP: {},                       // no announced cards on this page
      ELO_SCALE: 400, FORM_PTS: 8,
      onBanzuke: function(n){ return !!ROSTER[n]; },
      elo: function(n){ return ROSTER[n] ? ROSTER[n].elo : 2200; },
      pairKey: function(a,b){ return a < b ? a+"|"+b : b+"|"+a; }
    });
    return tkEngine;
  }

  function likelySchedule(name){
    var tk = buildEngine();
    if (!tk) return null;
    var tally = {};                        // day -> { opponent: times seen }
    for (var s = 0; s < TK_RUNS; s++){
      var out = tk.runSeason(tk.rng32(9176 + s * 7919), true);
      for (var d = 1; d <= 15; d++){
        var day = out.days[String(d)];
        if (!day) continue;
        ["makuuchi","juryo"].forEach(function(div){
          (day[div] || []).forEach(function(bt){
            var opp = bt[1] === name ? bt[5] : (bt[5] === name ? bt[1] : null);
            if (!opp) return;
            (tally[d] = tally[d] || {});
            tally[d][opp] = (tally[d][opp] || 0) + 1;
          });
        });
      }
    }
    /* Taking each day's most frequent opponent INDEPENDENTLY produces a card
       that repeats men — Fujinokawa on day 7 and again on day 8 — because he
       can win the vote on two different days across different runs. No such
       basho exists: nobody meets twice, and the engine itself forbids it. So
       assign greedily instead, most confident day first, each day taking the
       likeliest opponent still unclaimed. The result is one coherent card. */
    var order = [];
    for (var day = 1; day <= 15; day++){
      var t = tally[day];
      if (!t) { order.push({ day:day, dist:null, top:0 }); continue; }
      var top = 0;
      Object.keys(t).forEach(function(n){ if (t[n] > top) top = t[n]; });
      order.push({ day:day, dist:t, top:top });
    }
    var taken = {}, byDay = {};
    order.slice().sort(function(a,b){ return b.top - a.top; }).forEach(function(o){
      if (!o.dist) return;
      var pick = null;
      Object.keys(o.dist).forEach(function(n){
        if (taken[n]) return;
        if (!pick || o.dist[n] > o.dist[pick]) pick = n;
      });
      if (!pick) return;
      taken[pick] = 1;
      byDay[o.day] = { opp:pick, pct: Math.round(o.dist[pick] / TK_RUNS * 100),
                       spread: Object.keys(o.dist).length };
    });
    var rows = [];
    for (var d2 = 1; d2 <= 15; d2++){
      var hit = byDay[d2];
      rows.push(hit ? { day:d2, opp:hit.opp, pct:hit.pct, spread:hit.spread } : { day:d2, opp:null });
    }
    return rows;
  }

  /* One request per distinct opponent, a few at a time. Fifteen parallel
     fetches at sumo-api is rude and the page has nothing to do with the extra
     speed — the rows paint as each answer lands. */
  var h2hCache = {};
  function h2hFor(meId, oppId){
    var key = meId + ":" + oppId;
    if (h2hCache[key]) return h2hCache[key];
    h2hCache[key] = GGRoster.headToHead(meId, oppId).catch(function(){ return null; });
    return h2hCache[key];
  }
  function inSeries(jobs, width){
    var i = 0;
    function next(){ return i >= jobs.length ? Promise.resolve() : jobs[i++]().then(next); }
    return Promise.all(new Array(Math.min(width, jobs.length)).fill(0).map(next));
  }

  /* ── who is favoured ───────────────────────────────────────────────────
     The head-to-head column answers "have they met, and how did it go". It
     cannot answer "is this a good day for him", because most of these men have
     never met at all — the column is mostly "never met", and a blank is not an
     opinion.

     Rating is the only thing with an opinion about every pairing, so it is the
     base: the same logistic the simulator's bout model uses, on the same 400
     scale, so this page and the simulator never disagree about who is better.

         p = 1 / (1 + 10^((theirs − his) / 400))

     Where they HAVE met, the record should move that estimate — but by how
     much depends entirely on how often. Beating a man once is barely evidence;
     beating him nine times in twelve is most of what there is to know. So the
     rating estimate is treated as a prior worth EDGE_PRIOR meetings and the
     real series is added to it:

         p = (EDGE_PRIOR × p_rating + wins) / (EDGE_PRIOR + wins + losses)

     One meeting nudges the number a little, a long series takes it over. That
     is a Beta prior centred on the rating, and it is the reason a single fluke
     upset cannot flip a row from Favoured to Tough.

     EDGE_PRIOR is 6 because 4 and 8 each break at one end. Measured against the
     cases that actually matter, at the 58/42 thresholds below:

                                        k=4       k=6       k=8
       evenly rated, he is 1-0 up      60% Fav   57% Even  56% Even
       higher rated but 3-9 down       38% Tough 42% Tough 45% Even
       big underdog, 3-0 up            48% Even  39% Tough 34% Tough

     At 4 a single win turns a coin toss into "Favoured", which is exactly the
     over-reaction the prior exists to prevent. At 8 a 3-9 hiding reads as
     "Even", which no one watching those twelve bouts would accept. Six is the
     only one that gets both ends right.

     Both inputs missing means no opinion, and the row says so rather than
     printing an even 50% it has not earned. A rating alone is never defaulted:
     the simulator falls back to 2200 for a man with no dossier entry, which is
     right for running a tournament and wrong here, where it would manufacture
     a coin toss out of nothing. */
  var EDGE_PRIOR = 6;                    // the rating estimate is worth this many meetings

  function eloOf(name){
    var d = find(name) || {};
    var e = Number(d.elo);
    return (isFinite(e) && e > 0) ? e : 0;
  }
  function edgeOf(meName, oppName, h){
    var mine = eloOf(meName), his = eloOf(oppName);
    var met = h && h.total ? h : null;
    if (!mine || !his){
      if (!met) return null;             // nothing to go on, and we do not pretend
      return { p: (EDGE_PRIOR * 0.5 + h.a) / (EDGE_PRIOR + h.a + h.b), basis: "record" };
    }
    var p = 1 / (1 + Math.pow(10, (his - mine) / 400));
    if (!met) return { p: p, basis: "rating" };
    return { p: (EDGE_PRIOR * p + h.a) / (EDGE_PRIOR + h.a + h.b), basis: "both" };
  }

  /* Three words, not five. The model is a rating plus a handful of meetings;
     it can tell a mismatch from a coin toss and should not pretend to finer
     grain than that. The percentage beside the word carries the intensity, and
     the word carries the meaning — so colour is never the only tell, and a
     reader who cannot see the colour loses nothing. */
  function edgeLabel(p){
    if (p >= 0.58) return { word:"Favoured", cls:"lm-up" };
    if (p <= 0.42) return { word:"Tough",    cls:"lm-down" };
    return { word:"Even", cls:"lm-even" };
  }
  function edgeCell(e){
    if (!e) return '<span class="lm-none">—</span>';
    var l = edgeLabel(e.p);
    return '<b class="' + l.cls + '">' + l.word + '</b> <span class="lm-ep">' +
           Math.round(e.p * 100) + '%</span>';
  }
  var EDGE_WHY = { rating:"on current rating alone — they have never met",
                   record:"on their record alone — no rating for one of them",
                   both:"on current rating, moved by their record" };

  function renderLikely(r){
    var host = document.getElementById("h2hBody");
    if (!host) return;
    var meId = apiId(r);
    if (!meId){ host.innerHTML = '<p class="empty">Likely matchups need the live banzuke, which didn’t load.</p>'; return; }

    host.innerHTML = '<p class="empty">Working out who he is likely to meet…</p>';
    /* the sweep is synchronous and ~300ms, so yield first or the click that
       opened the profile appears to hang */
    setTimeout(function(){
      var rows = likelySchedule(r.n);
      if (!rows || !rows.some(function(x){ return x.opp; })){
        host.innerHTML = '<p class="empty">The matchmaking model couldn’t place him on a card.</p>';
        return;
      }

      host.innerHTML =
        '<p class="lm-note">Projected by the same matchmaking model the simulator uses, over ' +
        TK_RUNS + ' runs of the basho. <b>Seen</b> is how often that pairing came up — day one is ' +
        'near-certain, later days depend on how everyone is doing. <b>Edge</b> is his estimated ' +
        'chance of winning that bout, from current rating and adjusted by their head-to-head ' +
        'where they have one.</p>' +
        '<table class="lm"><thead><tr><th>Day</th><th>Likely opponent</th><th>Seen</th>' +
        '<th>Head to head</th><th>Edge</th></tr></thead><tbody>' +
        rows.map(function(row){
          if (!row.opp) return '<tr><td>' + row.day + '</td><td colspan="4" class="lm-none">no bout projected</td></tr>';
          var o = find(row.opp) || {};
          var lv = liveOf(row.opp) || {};
          return '<tr data-opp="' + esc(row.opp) + '"><td>' + row.day + '</td>' +
            '<td><a href="rikishi.html?n=' + encodeURIComponent(row.opp) + '&from=' +
              esc(String(qs().get("from") || "rikishi")) + '">' + esc(row.opp) + '</a>' +
              (lv.code ? ' <span class="lm-rank">' + esc(lv.code) + '</span>' : '') + '</td>' +
            '<td class="lm-pct">' + row.pct + '%</td>' +
            '<td class="lm-h2h" data-for="' + esc(row.opp) + '">…</td>' +
            '<td class="lm-edge" data-for="' + esc(row.opp) + '" title="' +
              esc(EDGE_WHY[(edgeOf(r.n, row.opp, null) || {}).basis] || "not enough to say") + '">' +
              edgeCell(edgeOf(r.n, row.opp, null)) + '</td></tr>';
        }).join("") + '</tbody></table>';

      var seen = {};
      var jobs = rows.filter(function(x){ return x.opp; }).map(function(row){
        return function(){
          if (seen[row.opp]) return Promise.resolve();
          seen[row.opp] = 1;
          var oppId = apiId(find(row.opp) || {});
          var cells = host.querySelectorAll('.lm-h2h[data-for="' + CSS.escape(row.opp) + '"]');
          var edges = host.querySelectorAll('.lm-edge[data-for="' + CSS.escape(row.opp) + '"]');
          if (!oppId){ cells.forEach(function(c){ c.textContent = "—"; }); return Promise.resolve(); }
          return h2hFor(meId, oppId).then(function(h){
            cells.forEach(function(c){
              if (!h || !h.total){ c.textContent = "never met"; c.className = "lm-h2h lm-new"; return; }
              /* green when he leads the series, red when he trails — the
                 number is right there too, so colour is never the only tell */
              var cls = h.a > h.b ? "lm-up" : (h.a < h.b ? "lm-down" : "lm-even");
              c.className = "lm-h2h " + cls;
              c.textContent = h.a + "–" + h.b;
            });
            /* the rating-only estimate is already on screen; fold the series in.
               Nothing moves for a pair who have never met, which is most of
               them — so the column does not flicker its way down the table. */
            if (h && h.total){
              var e = edgeOf(r.n, row.opp, h);
              edges.forEach(function(c){
                c.innerHTML = edgeCell(e);
                c.title = EDGE_WHY[(e || {}).basis] || "not enough to say";
              });
            }
          });
        };
      });
      inSeries(jobs, 4);
    }, 30);
  }

  /* ---------- router ---------- */
  function route(){
    var name = qs().get("n");
    if (!all().length) { view.innerHTML = '<p class="empty">The rikishi dossier didn’t load.</p>'; return; }
    /* The directory is the Rikishi tab on analysis.html now — keeping a second
       copy here would be two things to maintain and two answers to "where is
       the list". A bare rikishi.html is a bookmark from before that move. */
    if (!name) { location.replace("analysis.html#rikishi"); return; }
    var r = find(name);
    if (!r) {
      view.innerHTML = backLink() +
        '<p class="empty">No rikishi called “' + esc(name) + '” on this banzuke.</p>';
      return;
    }
    renderProfile(r);
  }

  /* The live banzuke makes ranks and records current, but the page is useful
     without it — render immediately from the dossier, then repaint if and when
     sumo-api answers. */
  function start(){
    route();
    if (!window.GGRoster || !GGRoster.load) return;
    GGRoster.load().then(function(res){
      if (!res || !res.ok || !res.ranks) return;
      LIVE = res.ranks;
      STARTED = !!res.started;
      route();
    }).catch(function(){});
  }

  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", start, { once:true });
  else start();

  window.addEventListener("popstate", route);
})();
</script>
</body>
</html>
